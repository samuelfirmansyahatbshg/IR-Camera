services:
  app:
    build:
      context: .
    container_name: ir-camera-app
    restart: unless-stopped
    devices:
      - /dev/i2c-1:/dev/i2c-1
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/healthz', timeout=2)
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: ir-camera-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
