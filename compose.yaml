services:
  app:
    image: ir-camera:arm64
    pull_policy: never
    platform: linux/arm64
    container_name: ir-camera-app
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      proxy:
        aliases:
          - ir-camera
    devices:
      - /dev/i2c-1:/dev/i2c-1
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/healthz', timeout=2)
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

networks:
  proxy:
    name: web-proxy
    external: true

