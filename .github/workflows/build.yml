name: Build ARM64 image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ir-camera
  IMAGE_TAG: arm64
  IMAGE_TAR: /tmp/ir-camera-arm64.tar
  IMAGE_ARCHIVE: /tmp/ir-camera-arm64.tar.gz
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  build:
    name: Linux ARM64 image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 Docker image archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          tags: |
            ir-camera:arm64
            ir-camera:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=docker,dest=${{ env.IMAGE_TAR }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify ARM64 image and health endpoint
        shell: bash
        run: |
          set -euo pipefail

          docker load --input "$IMAGE_TAR"
          test "$(docker image inspect "$IMAGE_NAME:$IMAGE_TAG" --format '{{.Os}}')" = "linux"
          test "$(docker image inspect "$IMAGE_NAME:$IMAGE_TAG" --format '{{.Architecture}}')" = "arm64"

          docker run --rm --platform linux/arm64 "$IMAGE_NAME:$IMAGE_TAG" \
            python -c "from importlib.metadata import version; import adafruit_mlx90640, cv2, flask, gunicorn, numpy; print({name: version(name) for name in ('Adafruit-Blinka', 'adafruit-circuitpython-mlx90640', 'Flask', 'gunicorn', 'numpy', 'opencv-python-headless', 'RPi.GPIO')})"

          cleanup() {
            docker rm --force ir-camera-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run \
            --detach \
            --name ir-camera-ci \
            --platform linux/arm64 \
            --publish 127.0.0.1:3000:3000 \
            "$IMAGE_NAME:$IMAGE_TAG"

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/healthz; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs ir-camera-ci
              exit 1
            fi
            sleep 2
          done

          cleanup
          trap - EXIT

      - name: Compress and verify loadable release archive
        shell: bash
        run: |
          set -euo pipefail

          gzip --best "$IMAGE_TAR"
          gzip --test "$IMAGE_ARCHIVE"

          docker image rm "$IMAGE_NAME:$IMAGE_TAG" "$IMAGE_NAME:${GITHUB_SHA}"
          docker load --input "$IMAGE_ARCHIVE"
          test "$(docker image inspect "$IMAGE_NAME:$IMAGE_TAG" --format '{{.Architecture}}')" = "arm64"

      - name: Publish ARM64 image release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          export GH_HOST="${GITHUB_SERVER_URL#https://}"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_tag="$GITHUB_REF_NAME"
            if gh release view "$release_tag" >/dev/null 2>&1; then
              gh release upload "$release_tag" "$IMAGE_ARCHIVE#ir-camera-arm64.tar.gz" --clobber
              gh release edit "$release_tag" --latest
            else
              gh release create "$release_tag" "$IMAGE_ARCHIVE#ir-camera-arm64.tar.gz" \
                --generate-notes \
                --latest \
                --title "IR Camera $release_tag"
            fi
          else
            short_sha="${GITHUB_SHA::12}"
            release_tag="build-${GITHUB_RUN_NUMBER}-r${GITHUB_RUN_ATTEMPT}"
            gh release create "$release_tag" "$IMAGE_ARCHIVE#ir-camera-arm64.tar.gz" \
              --latest \
              --notes "Automated Linux ARM64 image for commit $GITHUB_SHA." \
              --target "$GITHUB_SHA" \
              --title "IR Camera ARM64 $short_sha"
          fi
