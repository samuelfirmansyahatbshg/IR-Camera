name: Build ARM64 image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ir-camera
  IMAGE_TAG: arm64
  ARTIFACT_NAME: ir-camera-arm64
  IMAGE_TAR: /tmp/ir-camera-arm64.tar
  IMAGE_ARCHIVE: /tmp/ir-camera-arm64.tar.gz

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  build:
    name: Linux ARM64 image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 Docker image archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          tags: |
            ir-camera:arm64
            ir-camera:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=docker,dest=${{ env.IMAGE_TAR }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify ARM64 image and health endpoint
        shell: bash
        run: |
          set -euo pipefail

          docker load --input "$IMAGE_TAR"
          test "$(docker image inspect "$IMAGE_NAME:$IMAGE_TAG" --format '{{.Os}}')" = "linux"
          test "$(docker image inspect "$IMAGE_NAME:$IMAGE_TAG" --format '{{.Architecture}}')" = "arm64"

          docker run --rm --platform linux/arm64 "$IMAGE_NAME:$IMAGE_TAG" \
            python -c "from importlib.metadata import version; import adafruit_mlx90640, cv2, flask, gunicorn, numpy; print({name: version(name) for name in ('Adafruit-Blinka', 'adafruit-circuitpython-mlx90640', 'Flask', 'gunicorn', 'numpy', 'opencv-python-headless')})"

          cleanup() {
            docker rm --force ir-camera-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run \
            --detach \
            --name ir-camera-ci \
            --platform linux/arm64 \
            --publish 127.0.0.1:3000:3000 \
            "$IMAGE_NAME:$IMAGE_TAG"

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/healthz; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs ir-camera-ci
              exit 1
            fi
            sleep 2
          done

          cleanup
          trap - EXIT

      - name: Compress and verify loadable artifact
        shell: bash
        run: |
          set -euo pipefail

          gzip --best "$IMAGE_TAR"
          gzip --test "$IMAGE_ARCHIVE"

          docker image rm "$IMAGE_NAME:$IMAGE_TAG" "$IMAGE_NAME:${GITHUB_SHA}"
          docker load --input "$IMAGE_ARCHIVE"
          test "$(docker image inspect "$IMAGE_NAME:$IMAGE_TAG" --format '{{.Architecture}}')" = "arm64"

      - name: Upload ARM64 image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.IMAGE_ARCHIVE }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Attach image to version release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          export GH_HOST="${GITHUB_SERVER_URL#https://}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$IMAGE_ARCHIVE" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$IMAGE_ARCHIVE" \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
